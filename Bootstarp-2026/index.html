<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const logData = {
        message: message,
        source: source,
        line: lineno,
        column: colno,
        stack: error ? error.stack : ''
      };
      fetch('/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(logData)
      });
    };
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Bootstrap Master Course - Interactive Platform</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Slides & Platform Styling -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Lucide Icons Vector Assets CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Glow Background Accents -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- App Main Frame Grid -->
  <div id="app-container">
    
    <!-- Sidebar mobile backdrop overlay -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    
    <!-- Left Drawer Sidebar: Search, Progress, Slides Navigator -->
    <aside>
      <div class="sidebar-header">
        <h2>
          <span class="logo-icon">B</span>
          Bootstrap Master
        </h2>
        <div class="text-muted small mt-1">Beginner to Advanced Course</div>
      </div>
      
      <!-- Live Search Query Filter -->
      <div class="search-container">
        <input type="text" class="search-input" id="search-input" placeholder="🔍 Search curriculum...">
      </div>
      
      <!-- Dynamic slide lists grouped by modules -->
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Rendered dynamically by app.js -->
      </nav>
      
      <!-- Progress Bar Indicators -->
      <div class="progress-container">
        <div class="progress-label">
          <span>Course Completion</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>
    </aside>

    <!-- Right Workspace Area -->
    <main class="workspace-root">
      
      <!-- Slide Top Navbar -->
      <header class="slide-header">
        <div class="slide-title-wrapper">
          <h1 id="slide-title">Introduction to Bootstrap 5</h1>
          <p id="slide-subtitle">What is it, why use it, and how does it work?</p>
        </div>
        <div class="header-controls">
          <button class="header-btn" id="btn-theme-toggle" title="Switch Light/Dark mode">
            <i data-lucide="moon"></i> <span>Dark Mode</span>
          </button>
          <button class="header-btn" id="btn-toggle-sidebar" title="Toggle navigation sidebar drawer">
            <i data-lucide="menu"></i> <span>Menu</span>
          </button>
          <button class="header-btn" id="btn-fullscreen" title="Open Fullscreen Presentation View">
            <i data-lucide="maximize"></i> <span>Fullscreen</span>
          </button>
        </div>
      </header>

      <!-- Workspace Sub-tabs Navigation Bar -->
      <div class="tab-selection-bar">
        <button class="tab-btn active" id="tab-theory">
          <i data-lucide="book-open"></i> Theory
        </button>
        <button class="tab-btn" id="tab-visualizer">
          <i data-lucide="sliders"></i> Visual Visualizer
        </button>
        <button class="tab-btn" id="tab-playground">
          <i data-lucide="terminal"></i> Playground
        </button>
        <button class="tab-btn" id="tab-quiz">
          <i data-lucide="help-circle"></i> Quiz
        </button>
        <button class="tab-btn" id="tab-notes">
          <i data-lucide="check-square"></i> Notes & Best Practices
        </button>
      </div>

      <!-- Main panels body layout -->
      <div class="slide-workspace">
        
        <!-- Tab 1: Theory Explanation -->
        <div class="slide-pane active" id="pane-theory">
          <div class="theory-container" id="theory-content">
            <!-- Loaded dynamically -->
          </div>
        </div>

        <!-- Tab 2: Interactive visual tool container -->
        <div class="slide-pane" id="pane-visualizer">
          <div class="visualizer-pane-body" id="visualizer-workspace">
            <!-- Visualizers loaded dynamically by app.js -->
          </div>
        </div>

        <!-- Tab 3: Sandbox Editor Playground -->
        <div class="slide-pane" id="pane-playground">
          <div class="playground-container">
            <!-- Left editor screen -->
            <div class="editor-pane">
              <div class="editor-header">
                <span class="editor-title">HTML Editor (Bootstrap 5)</span>
                <button class="run-btn" id="btn-run-code">
                  <i data-lucide="play" style="width: 14px; height: 14px;"></i> Run Preview
                </button>
              </div>
              <textarea class="code-textarea" id="code-editor" spellcheck="false" autocomplete="off"></textarea>
            </div>
            
            <!-- Right live iframe preview panel -->
            <div class="preview-pane">
              <div class="preview-header">
                <span class="preview-title">Live Preview Rendering</span>
                
                <!-- Responsive Viewport Simulator Size Buttons -->
                <div class="responsive-sim-bar">
                  <button class="sim-size-btn active" data-size="desktop" title="Simulate Desktop Screen">🖥️ Desktop</button>
                  <button class="sim-size-btn" data-size="laptop" title="Simulate Laptop Screen">💻 Laptop</button>
                  <button class="sim-size-btn" data-size="tablet" title="Simulate Tablet Screen">📱 Tablet</button>
                  <button class="sim-size-btn" data-size="phone" title="Simulate Phone Screen">📞 Phone</button>
                </div>
              </div>
              <div class="preview-iframe-wrapper">
                <iframe class="preview-iframe device-desktop" id="preview-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab 4: Quiz Checklist Panel -->
        <div class="slide-pane" id="pane-quiz">
          <!-- Loaded dynamically -->
        </div>

        <!-- Tab 5: Notes & Exercises Panel -->
        <div class="slide-pane" id="pane-notes">
          <!-- Loaded dynamically -->
        </div>

      </div>

      <!-- Floating Slide Controller Panel -->
      <div class="floating-control-bar">
        <span class="slide-indicator" id="slide-indicator">1 / 15</span>
        
        <!-- Previous Button -->
        <button class="control-btn" id="btn-prev" aria-label="Previous Slide">
          <i data-lucide="chevron-left"></i>
        </button>
        
        <!-- Next Button -->
        <button class="control-btn primary-action" id="btn-next" aria-label="Next Slide">
          <i data-lucide="chevron-right"></i>
        </button>
        
        <span class="keyboard-hint d-none d-md-inline-block ms-1">Left / Right Arrows</span>
      </div>

    </main>
  </div>

  <!-- Mobile Backdrop Overlay Drawer Dimmer -->
  <div class="mobile-backdrop" id="mobile-backdrop"></div>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Curriculums Slides Array Metadata and Logic Controller -->
  <script src="slides.js"></script>
  <script src="app.js"></script>

  <!-- Lucide icon loader -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
